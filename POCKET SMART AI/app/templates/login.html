{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Welcome back
    </h1>

    <p>
        Sign in to save plans and
        view history.
    </p>


    <form id="loginForm">

        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >
        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
            >
        </label>


        <button class="button">
            Login
        </button>

    </form>


    <p
        id="message"
        class="message"
    ></p>


    <p>
        No account?

        <a href="/register">
            Register
        </a>
    </p>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .querySelector("#loginForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const form =
                new FormData(event.target);

            const response =
                await api(
                    "/login",
                    {
                        method: "POST",

                        body: JSON.stringify(
                            Object.fromEntries(
                                form
                            )
                        ),

                        headers: {
                            "Content-Type":
                                "application/json"
                        }
                    }
                );


            if (response.access_token) {

                localStorage.token =
                    response.access_token;

                location =
                    "/dashboard";

            } else {

                document
                    .querySelector("#message")
                    .textContent =
                    response.detail ||
                    "Login failed";
            }

        }
    );

</script>

{% endblock %}
