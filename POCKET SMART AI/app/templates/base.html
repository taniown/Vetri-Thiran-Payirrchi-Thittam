<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >

</head>

<body>

<nav>

    <a
        class="brand"
        href="/"
    >
        PocketSmart AI
    </a>

    <div>

        <a href="/planner/home">
            Home
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        <a href="/history">
            History
        </a>

        <a
            id="authLink"
            href="/login"
        >
            Login
        </a>

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>
    PocketSmart AI ·
    Budget-aware recommendations ·
    Indicative prices only
</footer>


<script src="/static/app.js"></script>


{% block scripts %}
{% endblock %}

</body>
</html>
