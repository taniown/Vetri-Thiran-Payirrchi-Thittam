{% extends "base.html" %}

{% block title %}
Register — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Create your account
    </h1>


    <form id="registerForm">

        <label>
            Name

            <input
                name="name"
                required
                minlength="2"
            >
        </label>


        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >
        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
                minlength="8"
            >
        </label>


        <button class="button">
            Create account
        </button>

    </form>


    <p
        id="message"
        class="message"
    ></p>


    <p>
        Already registered?

        <a href="/login">
            Login
        </a>
    </p>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .querySelector("#registerForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const form =
                new FormData(event.target);

            const response =
                await api(
                    "/register",
                    {
                        method: "POST",

                        body: JSON.stringify(
                            Object.fromEntries(
                                form
                            )
                        ),

                        headers: {
                            "Content-Type":
                                "application/json"
                        }
                    }
                );


            if (response.access_token) {

                localStorage.token =
                    response.access_token;

                location =
                    "/dashboard";

            } else {

                document
                    .querySelector("#message")
                    .textContent =
                    response.detail ||
                    "Registration failed";
            }

        }
    );

</script>

{% endblock %}
